<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a1628; }
  #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  #topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; background: linear-gradient(180deg, #0a1628 0%, #12253f 100%); color: #fff; padding: 8px 15px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-bottom: 2px solid #00e676; }
  .header-titles { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
  .title-right { text-align: right; } .title-left { text-align: left; }
  .main-title { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

  .header-controls { display: flex; justify-content: center; align-items: center; gap: 6px; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(0,230,118,0.2); }
  
  #status { display: flex; align-items: center; gap: 4px; font-size: 10px; margin-right: 5px;}
  #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; }
  #status-dot.live { background: #00e676; animation: pulse 2s infinite; }

  #left-sources {
      position: absolute; top: 160px; left: 10px; z-index: 1000;
      background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px;
      display: flex; flex-direction: column; gap: 8px;

      pointer-events: none;
  }
  .source-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,0.8); font-family: monospace; }
  .source-item .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; transition: all 0.3s; }
  .source-item .dot.active { background: #00e676; box-shadow: 0 0 8px #00e676; }
  .source-item .dot.sim { background: #ffa726; box-shadow: 0 0 8px #ffa726; }

  #debug-panel { display: none; position: absolute; top: 110px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.85); color: #00e676; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 5px; border: 1px solid #00e676; direction: ltr; pointer-events: none; box-shadow: 0 0 10px rgba(0,230,118,0.3); line-height: 1.4; }
  
  #sources { position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000; background: linear-gradient(135deg, #0a1628 0%, #1a2f4a 100%); border-radius: 16px 16px 0 0; color: #fff; padding: 12px 12px 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.4); transition: transform 0.3s ease; }
  #sources.collapsed { transform: translateY(calc(100% - 45px)); }

  #toggle-collapse { font-size: 18px; transition: transform 0.3s; }
  #sources.collapsed #toggle-collapse { transform: rotate(180deg); }
  #source-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; max-height: 40vh; overflow-y: auto; }
  .source-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 12px 15px; color: #fff; font-size: 13px; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; transition: all 0.2s; font-family: inherit; width: 100%; }
  .source-btn:active { transform: scale(0.97); }
  .source-btn .icon { font-size: 20px; }
  .source-btn .btn-text { flex: 1; text-align: right; font-weight: 500; }
  .source-btn .status { display: flex; justify-content: center; align-items: center; height: 10px; width: 20px; }
  .source-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; transition: all 0.3s; }
  .source-btn.active { background: rgba(0, 230, 118, 0.15); border-color: #00e676; }
  .source-btn.active .dot { background: #00e676; box-shadow: 0 0 8px #00e676; }

  .top-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 6px 8px; color: #fff; font-size: 14px; cursor: pointer; font-family: inherit; transition: opacity 0.2s; display: flex; justify-content: center; align-items: center; }
  .top-btn:active { transform: scale(0.95); }
  .top-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #settings-modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; padding: 20px; }
  #settings-modal.show { display: flex; }
  #settings-content { background: #1a2f4a; color: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  #settings-content h2 { font-size: 16px; margin-bottom: 5px; text-align: center;}
  .dev-name { text-align: center; font-size: 15px; font-weight: bold; color: #00e676; margin-bottom: 2px; font-family: monospace; }
  .dev-date { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
  #settings-content label { font-size: 12px; display: block; margin-bottom: 4px; opacity: 0.8; margin-top: 10px;}
  #settings-content input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 12px; font-size: 14px; font-family: inherit; }
  .modal-buttons { display: flex; gap: 8px; margin-top: 10px; }
  .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primary { background: #00e676; color: #0a1628; } .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; } .btn-danger { background: #ff4444; color: #fff; margin-top: 15px; width: 100%; font-size: 12px;}
  .leaflet-popup-content-wrapper { background: #0a1628; color: #fff; border-radius: 12px; font-family: inherit; }
  .leaflet-popup-tip { background: #0a1628; } .leaflet-popup-content { margin: 12px; }
  .popup-title { font-size: 15px; font-weight: 700; color: #00e676; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .popup-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .popup-row .label { opacity: 0.6; } .popup-row .value { font-weight: 500; }
  .leaflet-control-zoom { margin-top: 80px !important; margin-right: 10px !important; margin-left: auto !important; }
  .ring-label-marker { background: transparent; border: none; box-shadow: none; color: #82a5c1; font-size: 11px; font-family: monospace; font-weight: bold; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000; white-space: nowrap; margin-left: 50%; transform: translateX(-50%); }
  .waypoint-label { color: #ffa726; font-size: 10px; font-weight: bold; font-family: monospace; text-shadow: 1px 1px 2px #000; white-space: nowrap; }
</style>

<body>

<div id="map"></div>
<div id="debug-panel"></div>

<div id="left-sources">
    <div class="source-item" id="src-atc"><div class="dot"></div> <div>محطة الرادار الدولية (ATC)</div></div>
    <div class="source-item" id="src-ploto"><div class="dot"></div> <div>معلومات بلوتو (PLOTO)</div></div>

    <div class="source-item" id="src-internet"><div class="dot"></div> <div>بيانات الشبكة</div></div>
</div>

<div id="topbar">
  <div class="header-titles">
    <div class="title-right">
      <div class="main-title">مطار اللاذقية الدولي</div>
      <div class="sub-title">نظام الرادار v14.1</div>

    <button class="source-btn placeholder" data-source="atc"><div class="icon">📡</div><div class="btn-text">محطة الرادار الدولية مطار اللاذقية</div><div class="status"><span class="dot"></span></div></button>
    <button class="source-btn placeholder" data-source="ploto"><div class="icon">🛰️</div><div class="btn-text">معلومات بلوتو PA4</div><div class="status"><span class="dot"></span></div></button>
    <button class="source-btn placeholder" data-source="near"><div class="icon">📶</div><div class="btn-text">Near Radar</div><div class="status"><span class="dot"></span></div></button>

    <button class="source-btn active" data-source="opensky"><div class="icon">🌐</div><div class="btn-text">بيانات الشبكة</div><div class="status"><span class="dot"></span></div></button>

    <label>خط الطول (Longitude)</label>
    <input type="number" id="input-lng" step="0.0001" value="35.9486">
    <label>مدى الرادار الكلي (كم)</label>
    <input type="number" id="input-radius" step="10" value="250">

<div style="position: absolute; bottom: 60px; width: 100%; text-align: center; color: rgba(255,255,255,0.3); font-size: 10px; z-index: 1000; pointer-events: none; font-family: monospace;">
  © 2023 Eng. Modar Hasan - All Rights Reserved
</div>

<script>
// ** الرابط الجديد لـ Deno Deploy **
const API_BASE = 'https://wide-crane-2295.mmdr7104-boop.deno.net';

const DEFAULT_CONFIG = { name: 'مطار اللاذقية الدولي', lat: 35.4011, lng: 35.9486, radius: 250, ringInterval: 50, showRings: true, darkMap: false, showAirways: true };
let config = JSON.parse(localStorage.getItem('radar_config') || 'null') || {...DEFAULT_CONFIG};

const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([config.lat, config.lng], 9);
const darkMapLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });
const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });

if (config.darkMap) { darkMapLayer.addTo(map); } else { satelliteLayer.addTo(map); document.getElementById('toggle-map-btn').style.opacity = '0.6'; }

const airwaysLayer = L.layerGroup().addTo(map);
const airwaysData = [
  { name: "UL620", coords: [[36.2, 35.5], [35.4, 35.9], [34.5, 36.0], [33.5, 35.8]], color: "#ff9800" },
  { name: "UR219", coords: [[37.0, 36.5], [36.0, 36.3], [35.4, 35.9], [34.0, 36.5], [32.0, 36.5]], color: "#29b6f6" },
  { name: "UP60", coords: [[36.5, 32.0], [36.0, 34.0], [35.4, 35.9], [35.2, 36.5], [35.0, 38.0]], color: "#ab47bc" }
];
const waypoints = [
  { name: "LATAKIA", lat: 35.4011, lng: 35.9486 }, { name: "BEIRUT", lat: 33.8208, lng: 35.4883 }, { name: "CYPRUS", lat: 35.0000, lng: 33.0000 }, { name: "ALEPPO", lat: 36.1800, lng: 37.2200 }
];

function drawAirways() {
  airwaysLayer.clearLayers();
  if (!config.showAirways) return;
  airwaysData.forEach(airway => {
    L.polyline(airway.coords, { color: airway.color, weight: 2, opacity: 0.6, dashArray: '8, 8' }).addTo(airwaysLayer);
    const midPoint = airway.coords[Math.floor(airway.coords.length / 2)];
    L.marker(midPoint, { icon: L.divIcon({ className: 'waypoint-label', html: airway.name, iconSize: [50, 20], iconAnchor: [25, 10] }), interactive: false }).addTo(airwaysLayer);
  });
  waypoints.forEach(wp => {
    L.circleMarker([wp.lat, wp.lng], { radius: 4, color: '#ffca28', weight: 2, fillColor: '#000', fillOpacity: 1 }).addTo(airwaysLayer);
    L.marker([wp.lat, wp.lng], { icon: L.divIcon({ className: 'waypoint-label', html: wp.name, iconSize: [80, 20], iconAnchor: [40, -5] }), interactive: false }).addTo(airwaysLayer);
  });
}

document.getElementById('toggle-airways-btn').addEventListener('click', () => {
  config.showAirways = !config.showAirways;
  localStorage.setItem('radar_config', JSON.stringify(config));
  document.getElementById('toggle-airways-btn').style.opacity = config.showAirways ? '1' : '0.4';
  drawAirways();
});
if (!config.showAirways) { document.getElementById('toggle-airways-btn').style.opacity = '0.4'; }

let centerMarker = null, rangeCircle = null, rangeRings = [];

function drawCenter() {
  if (centerMarker) map.removeLayer(centerMarker);
  if (rangeCircle) map.removeLayer(rangeCircle);
  const svg = `<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.4"/><circle cx="15" cy="15" r="6" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.7"/><circle cx="15" cy="15" r="3" fill="#00e676"/><line x1="15" y1="0" x2="15" y2="8" stroke="#00e676" stroke-width="1.5"/><line x1="15" y1="22" x2="15" y2="30" stroke="#00e676" stroke-width="1.5"/><line x1="0" y1="15" x2="8" y2="15" stroke="#00e676" stroke-width="1.5"/><line x1="22" y1="15" x2="30" y2="15" stroke="#00e676" stroke-width="1.5"/></svg>`;
  centerMarker = L.marker([config.lat, config.lng], { icon: L.divIcon({ html: svg, className: '', iconSize: [30,30], iconAnchor: [15,15] }) }).addTo(map);
  rangeCircle = L.circle([config.lat, config.lng], { radius: config.radius * 1000, color: '#00e676', weight: 1, opacity: 0.3, fillColor: '#00e676', fillOpacity: 0.03, dashArray: '5, 10' }).addTo(map);
  drawRings();
  drawAirways();
}

function drawRings() {
  rangeRings.forEach(r => map.removeLayer(r)); rangeRings = [];
  if (!config.showRings || config.ringInterval <= 0) return;
  for (let d = config.ringInterval; d < config.radius; d += config.ringInterval) {
    const circle = L.circle([config.lat, config.lng], { radius: d * 1000, color: '#4a7c9d', weight: 1, opacity: 0.5, fill: false, dashArray: '3, 6' }).addTo(map);
    rangeRings.push(circle);
    const labelLat = config.lat + (d / 111.32); 
    const labelMarker = L.marker([labelLat, config.lng], { icon: L.divIcon({ className: 'ring-label-marker', html: `<div>${d}</div>`, iconSize: [20, 10], iconAnchor: [10, 5] }), interactive: false }).addTo(map);
    rangeRings.push(labelMarker);
  }
  if (centerMarker) centerMarker.bringToFront();
}
if (!config.showRings) { document.getElementById('toggle-rings-btn').style.opacity = '0.4'; }

document.getElementById('toggle-map-btn').addEventListener('click', () => {
  config.darkMap = !config.darkMap;
  localStorage.setItem('radar_config', JSON.stringify(config));
  if (config.darkMap) { map.removeLayer(satelliteLayer); map.addLayer(darkMapLayer); document.getElementById('toggle-map-btn').style.opacity = '1'; } 
  else { map.removeLayer(darkMapLayer); map.addLayer(satelliteLayer); document.getElementById('toggle-map-btn').style.opacity = '0.6'; }
  if (centerMarker) centerMarker.bringToFront();
});

document.getElementById('toggle-rings-btn').addEventListener('click', () => {
  config.showRings = !config.showRings;
  localStorage.setItem('radar_config', JSON.stringify(config));
  document.getElementById('toggle-rings-btn').style.opacity = config.showRings ? '1' : '0.4';
  drawRings();
});

const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', () => { fetchData(); });

function clearCache() { localStorage.clear(); sessionStorage.clear(); window.location.replace(window.location.pathname + '?v=' + Date.now()); }

const aircraftMarkers = new Map();
let isFetching = false;
let isManualSimulation = false;

function aircraftIcon(heading, onGround) {
  const color = onGround ? '#ffa726' : '#00e676';
  return L.divIcon({
    html: `<svg width="30" height="30" viewBox="0 0 24 24" style="transform: rotate(${heading||0}deg); filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.6));"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="${color}" stroke="#0a1628" stroke-width="1"/></svg>`,
    className: '', iconSize: [30,30], iconAnchor: [15,15]
  });
}

function distanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function popupContent(s) {
  const dist = distanceKm(config.lat, config.lng, s.lat, s.lon);
  const isGround = s.alt_baro === 'ground';
  const altFt = isGround ? 0 : (s.alt_baro || 0);
  const altM = Math.round(altFt * 0.3048);
  const speed = Math.round((s.gs || 0) * 1.852);
  const callsign = (s.flight || '').trim() || s.hex.toUpperCase();
  
  return `
    <div class="popup-title">✈️ ${callsign}</div>
    <div class="popup-row"><span class="label">ICAO24</span><span class="value">${s.hex.toUpperCase()}</span></div>
    <div class="popup-row"><span class="label">الارتفاع</span><span class="value">${isGround ? 'على الأرض' : altM + ' م'}</span></div>
    <div class="popup-row"><span class="label">السرعة</span><span class="value">${speed} كم/س</span></div>
    <div class="popup-row"><span class="label">الاتجاه</span><span class="value">${Math.round(s.track || 0)}°</span></div>
    <div class="popup-row"><span class="label">المسافة من المركز</span><span class="value">${dist.toFixed(1)} كم</span></div>
    ${s.squawk ? `<div class="popup-row"><span class="label">Squawk</span><span class="value">${s.squawk}</span></div>` : ''}
  `;
}

function generateDemoData() {
    const demoPlanes = [];
    for (let i = 0; i < 15; i++) {
        demoPlanes.push({
            hex: "demo" + i,
            flight: "SIM" + Math.floor(Math.random() * 9000),
            lat: config.lat + (Math.random() - 0.5) * 4,
            lon: config.lng + (Math.random() - 0.5) * 4,
            alt_baro: 30000 + Math.random() * 5000,
            gs: 400 + Math.random() * 100,
            track: Math.random() * 360,
            squawk: "1234"
        });
    }
    return demoPlanes;
}

function updateSourceLights(mode) {
    document.querySelectorAll('#left-sources .dot').forEach(dot => {
        dot.classList.remove('active', 'sim', 'fail');
    });
    if (mode === 'live') {
        document.getElementById('src-internet').querySelector('.dot').classList.add('active');
    } else if (mode === 'sim') {
        document.getElementById('src-internet').querySelector('.dot').classList.add('sim');
    } else if (mode === 'fail') {
        document.getElementById('src-internet').querySelector('.dot').classList.add('fail');
    }
}

const toggleSimBtn = document.getElementById('toggle-sim-btn');
toggleSimBtn.addEventListener('click', () => {
    isManualSimulation = !isManualSimulation;
    const statusTxt = document.getElementById('status-text');
    
    if (isManualSimulation) {
        toggleSimBtn.style.background = '#ffa726';
        toggleSimBtn.style.color = '#0a1628';
        statusTxt.textContent = 'وضع المحاكاة (يدوي)';
        statusTxt.style.color = '#ffa726';
        document.getElementById('status-dot').classList.add('live');
        
        for (const m of aircraftMarkers.values()) map.removeLayer(m);
        aircraftMarkers.clear();

        updateSourceLights('sim');
        const demoPlanes = generateDemoData();
        updateAircraftData(demoPlanes, true);
    } else {
        toggleSimBtn.style.background = 'rgba(255,255,255,0.1)';
        toggleSimBtn.style.color = '#ffa726';
        
        for (const m of aircraftMarkers.values()) map.removeLayer(m);
        aircraftMarkers.clear();
        
        fetchData();
    }
});

async function fetchData() {
  if (isFetching || isManualSimulation) return;
  isFetching = true;
  
  const txt = document.getElementById('status-text');
  txt.textContent = 'جاري...';
  txt.style.color = '#fff';

  try {
    const url = `${API_BASE}/?lat=${config.lat}&lon=${config.lng}&radius=${config.radius}`;
    const res = await fetch(url, { cache: 'no-store' });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    const planes = data.ac || [];

    if (planes.length === 0) {
      updateSourceLights('fail');
      txt.textContent = 'لا طائرات';
      txt.style.color = '#ffa726';
    } else {
      updateSourceLights('live');
      txt.textContent = `حي (${planes.length})`;
      txt.style.color = '#00e676';
    }

    updateAircraftData(planes, false);
  } catch (err) {
    console.error('Fetch failed:', err);
    updateSourceLights('fail');
    txt.textContent = 'خطأ في الاتصال';
    txt.style.color = '#ff4444';
  } finally {
    isFetching = false;
  }
}

// دالة تحديث الطائرات على الخريطة
function updateAircraftData(planes, isDemo) {
  const currentHexes = new Set();

  planes.forEach(plane => {
    if (!plane.lat || !plane.lon) return; 
    const hex = plane.hex;
    currentHexes.add(hex);

    if (aircraftMarkers.has(hex)) {
      const marker = aircraftMarkers.get(hex);
      // حركة سلسة إذا كانت البيانات حقيقية
      marker.setLatLng([plane.lat, plane.lon]);
      marker.setIcon(aircraftIcon(plane.track, plane.alt_baro === 'ground'));
      marker.setPopupContent(popupContent(plane));
    } else {
      const marker = L.marker([plane.lat, plane.lon], {
        icon: aircraftIcon(plane.track, plane.alt_baro === 'ground')
      }).addTo(map);
      marker.bindPopup(popupContent(plane));
      aircraftMarkers.set(hex, marker);
    }
  });

  // مسح الطائرات التي اختفت
  for (const [hex, marker] of aircraftMarkers.entries()) {
    if (!currentHexes.has(hex)) {
      map.removeLayer(marker);
      aircraftMarkers.delete(hex);
    }
  }
}

// تشغيل الرادار
drawCenter();

// تحديث تلقائي كل 5 ثوانٍ
setInterval(() => {
  if (!isManualSimulation && !document.hidden) fetchData();
}, 5000);

// أول جلب فوري
fetchData();

// إعدادات
document.getElementById('settings-btn').addEventListener('click', () => {
  document.getElementById('settings-modal').classList.add('show');
});
function closeSettings() {
  document.getElementById('settings-modal').classList.remove('show');
}
function saveSettings() {
  config.name = document.getElementById('input-name').value;
  config.lat = parseFloat(document.getElementById('input-lat').value);
  config.lng = parseFloat(document.getElementById('input-lng').value);
  config.radius = parseFloat(document.getElementById('input-radius').value);
  config.ringInterval = parseFloat(document.getElementById('input-ring-interval').value);
  localStorage.setItem('radar_config', JSON.stringify(config));
  closeSettings();
  map.setView([config.lat, config.lng], map.getZoom());
  drawCenter();
  fetchData();
}
function toggleSources() {
  document.getElementById('sources').classList.toggle('collapsed');
}
</script>
